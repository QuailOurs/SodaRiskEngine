name: Verify

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and enforce coverage
        working-directory: server
        run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            server/**/target/surefire-reports
            server/**/target/site/jacoco

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - working-directory: apps/console
        run: npm ci
      - working-directory: apps/console
        run: npm run lint
      - working-directory: apps/console
        run: npm run test:unit:coverage
      - working-directory: apps/console
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-coverage
          path: apps/console/coverage
